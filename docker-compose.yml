name: ProductSync

services:
  product-sync:
    build: .
    container_name: product-price-sync

    ports:
      - "8002:8000"

    environment:
      - TZ=Asia/Dhaka
      - DEBUG=False

    env_file:
      - .env

    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/ProductSync/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    restart: always
    network_mode: bridge